name: Daily SOXL signal

on:
  schedule:
    # GitHub 예약 실행은 몇 시간씩 늦거나 건너뛰는 일이 있어서 여러 번 시도합니다.
    # 이미 처리된 날이면 run_daily.py가 아무것도 바꾸지 않고 끝나므로 중복 걱정은 없습니다.
    - cron: "30 22 * * *"
    - cron: "30 23 * * *"
    - cron: "30 0 * * *"
    - cron: "30 2 * * *"
    - cron: "30 5 * * *"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 버튼으로도 테스트 가능

permissions:
  contents: write

concurrency:
  group: daily-soxl
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run daily signal calculation + KakaoTalk notification
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
        run: python run_daily.py

      - name: Commit updated state back to the repo
        run: |
          git config user.name "soxl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/ docs/latest.json docs/config.json docs/history.json docs/equity.json
          git diff --cached --quiet || git commit -m "state: $(date -u +%Y-%m-%d) daily update"
          git pull --rebase --autostash
          git push
