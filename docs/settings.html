<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SOXL 설정값</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="SOXL 신호" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <h1>설정값</h1>
    <div class="updated" id="updated">불러오는 중…</div>
  </header>
  <nav class="tabs">
    <a href="./index.html">오늘의 신호</a>
    <a href="./settings.html" class="active">설정값</a>
    <a href="./positions.html">포지션 수정</a>
  </nav>
  <div id="content"></div>

<script src="./gh-common.js"></script>
<script>
let CONFIG_DATA = null; // raw docs/config.json, for read-only display
let editingId = null;   // portfolio id currently in edit mode

async function load() {
  const content = document.getElementById('content');
  if (!hasGhCreds()) {
    content.innerHTML = renderGhSetupForm('설정을 여기서 바로 바꾸려면, 이 저장소에만 쓰기 권한을 주는 개인 액세스 토큰이 필요합니다.');
    document.getElementById('updated').textContent = '';
    wireGhSetupForm(load);
    return;
  }
  try {
    const res = await fetch('./config.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('config.json 없음');
    CONFIG_DATA = await res.json();
    document.getElementById('updated').innerHTML =
      '갱신: ' + new Date(CONFIG_DATA.generated_at).toLocaleString('ko-KR') +
      ' · <a href="#" id="disconnect" style="color:var(--muted)">GitHub 연결 해제</a>';
    render();
    document.getElementById('disconnect').onclick = (e) => {
      e.preventDefault();
      clearGhCreds();
      load();
    };
  } catch (e) {
    content.innerHTML = `<div class="card"><div class="err">${e.message}</div></div>`;
  }
}

function render() {
  document.getElementById('content').innerHTML = CONFIG_DATA.portfolios.map(renderPortfolio).join('');
  CONFIG_DATA.portfolios.forEach(p => {
    const btn = document.getElementById('edit-' + p.id);
    if (btn) btn.onclick = () => { editingId = (editingId === p.id) ? null : p.id; render(); };
  });
  if (editingId) wireEditForm(CONFIG_DATA.portfolios.find(p => p.id === editingId));
}

function renderPortfolio(p) {
  const label = p.short_label || p.name;
  const isEditing = editingId === p.id;
  let html = `<div class="card"><button class="edit-toggle" id="edit-${p.id}">${isEditing ? '취소' : '편집'}</button>`;
  html += `<h2>${label}</h2>`;
  html += `<div class="sub">${p.ticker} · ${p.preset_name} 프리셋 ${p.active ? '' : '(비활성)'} ${p.kakao_enabled ? '' : '· 알림 꺼짐'}</div>`;

  if (isEditing) {
    html += renderEditForm(p);
  } else {
    html += '<div class="section-title">기본값</div><div class="kv">';
    html += pill('초기원금', money(p.principal));
    html += pill('시드분할', p.split + '개');
    html += pill('복리율', fmtPct(p.comp));
    html += pill('매매수수료', fmtPct(p.fee));
    html += pill('세금(SEC 등)', fmtPct(p.sec));
    html += pill('추가매수범위', fmtPct(p.extrange));
    html += pill('주문방식', p.order_type === 'FIXODC' ? '건수 고정' : '수량 고정');
    html += pill('추가주문건수', p.odcount);
    if (p.step != null) html += pill('수량스텝', p.step);
    html += pill('MOC날 매수', p.mocbuy ? 'ON' : 'OFF');
    html += pill('알림', p.kakao_enabled ? 'ON' : 'OFF');
    html += pill('운용상태', p.active ? '활성' : '비활성');
    html += '</div>';

    html += '<div class="section-title">티어별 설정</div>';
    html += '<table class="tiers"><thead><tr><th>티어</th><th>비중</th><th>ODGAP</th><th>목표</th><th>손절일</th></tr></thead><tbody>';
    for (let i = 0; i < p.split; i++) {
      html += `<tr><td>${i + 1}번</td><td>${fmtPct(p.weights[i])}</td><td>${fmtPct(p.odgap[i])}</td><td>+${fmtPct(p.target[i])}</td><td>${p.loss_days[i]}영업일</td></tr>`;
    }
    html += '</tbody></table>';
  }

  html += '</div>';
  return html;
}

function pill(label, value) {
  return `<div class="pill">${label} <b>${value}</b></div>`;
}

function renderEditForm(p) {
  let html = '<div class="section-title">기본값 (%는 % 단위로 입력)</div><div class="kv">';
  html += editPill('복리율(%)', 'comp', (p.comp * 100));
  html += editPill('매매수수료(%)', 'fee', (p.fee * 100));
  html += editPill('세금(%)', 'sec', (p.sec * 100), 6);
  html += editPill('추가매수범위(%)', 'extrange', (p.extrange * 100));
  html += editPill('추가주문건수', 'odcount', p.odcount, 0);
  html += `<div class="pill editable">MOC날 매수 <input type="checkbox" id="f-mocbuy" ${p.mocbuy ? 'checked' : ''} /></div>`;
  html += `<div class="pill editable">카카오 알림 <input type="checkbox" id="f-kakao" ${p.kakao_enabled ? 'checked' : ''} /></div>`;
  html += `<div class="pill editable">운용중 <input type="checkbox" id="f-active" ${p.active ? 'checked' : ''} /></div>`;
  html += '</div>';
  html += '<div class="help">초기원금 · 시드분할 · 주문방식은 이미 시작된 계좌 구조와 얽혀있어서 여기서는 못 바꿉니다.</div>';

  html += '<div class="section-title">티어별 설정 (% 단위)</div>';
  html += '<table class="tiers"><thead><tr><th>티어</th><th>비중%</th><th>ODGAP%</th><th>목표%</th><th>손절일</th></tr></thead><tbody>';
  for (let i = 0; i < p.split; i++) {
    html += `<tr><td>${i + 1}번</td>
      <td><input class="tier-input" id="w-${i}" type="number" step="0.01" value="${(p.weights[i] * 100).toFixed(2)}" /></td>
      <td><input class="tier-input" id="g-${i}" type="number" step="0.01" value="${(p.odgap[i] * 100).toFixed(4)}" /></td>
      <td><input class="tier-input" id="t-${i}" type="number" step="0.01" value="${(p.target[i] * 100).toFixed(2)}" /></td>
      <td><input class="tier-input" id="l-${i}" type="number" step="1" value="${p.loss_days[i]}" /></td>
      </tr>`;
  }
  html += '</tbody></table>';

  html += `<div class="save-bar">
    <button class="cancel" id="cancelBtn">취소</button>
    <button class="save" id="saveBtn">저장</button>
  </div>`;
  return html;
}

function editPill(label, id, value, decimals = 4) {
  return `<div class="pill editable">${label} <input class="kv-input" id="f-${id}" type="number" step="0.0001" value="${Number(value).toFixed(decimals)}" /></div>`;
}

function wireEditForm(p) {
  document.getElementById('cancelBtn').onclick = () => { editingId = null; render(); };
  document.getElementById('saveBtn').onclick = () => saveEdits(p);
}

async function saveEdits(p) {
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = '저장 중…';
  try {
    const weights = [], odgap = [], target = [], loss_days = [];
    for (let i = 0; i < p.split; i++) {
      weights.push(Number(document.getElementById('w-' + i).value) / 100);
      odgap.push(Number(document.getElementById('g-' + i).value) / 100);
      target.push(Number(document.getElementById('t-' + i).value) / 100);
      loss_days.push(parseInt(document.getElementById('l-' + i).value, 10));
    }
    const updates = {
      weights, odgap, target, loss_days,
      comp: Number(document.getElementById('f-comp').value) / 100,
      fee: Number(document.getElementById('f-fee').value) / 100,
      sec: Number(document.getElementById('f-sec').value) / 100,
      extrange: Number(document.getElementById('f-extrange').value) / 100,
      odcount: parseInt(document.getElementById('f-odcount').value, 10),
      mocbuy: document.getElementById('f-mocbuy').checked,
    };
    const kakao_enabled = document.getElementById('f-kakao').checked;
    const active = document.getElementById('f-active').checked;

    // 1) config/presets.json
    const presetsFile = await ghGetFile('config/presets.json');
    if (!presetsFile.data[p.preset_name]) throw new Error(`presets.json에 "${p.preset_name}" 프리셋이 없습니다`);
    Object.assign(presetsFile.data[p.preset_name], updates);
    await ghPutFile('config/presets.json', presetsFile.data, presetsFile.sha, `설정 변경: ${p.preset_name} (웹 대시보드)`);

    // 2) config/portfolios.json (active / kakao_enabled)
    const portfoliosFile = await ghGetFile('config/portfolios.json');
    const entry = portfoliosFile.data.find(x => x.id === p.id);
    if (!entry) throw new Error(`portfolios.json에 "${p.id}"가 없습니다`);
    entry.active = active;
    entry.kakao_enabled = kakao_enabled;
    await ghPutFile('config/portfolios.json', portfoliosFile.data, portfoliosFile.sha, `설정 변경: ${p.id} 활성/알림 (웹 대시보드)`);

    toast('저장 완료 ✅ 다음 자동 실행부터 반영됩니다');
    editingId = null;
    // Note: docs/config.json itself only updates on the next scheduled/manual Action run.
  } catch (err) {
    toast(err.message, 6000);
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = '저장';
  }
}

load();
</script>
</body>
</html>
