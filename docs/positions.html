<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SOXL 포지션 수정</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="SOXL 신호" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <h1>포지션 수정</h1>
    <div class="updated" id="updated">불러오는 중…</div>
  </header>
  <nav class="tabs">
    <a href="./index.html">오늘의 신호</a>
    <a href="./settings.html">설정값</a>
    <a href="./positions.html" class="active">포지션 수정</a>
  </nav>
  <div id="content"></div>

<script src="./gh-common.js"></script>
<script>
let PORTFOLIOS = [];   // from config/portfolios.json via GitHub API (id, name, short_label, state_file, ...)
let FEES = {};         // id -> fee rate, from docs/config.json (public, no auth needed)
let STATE = {};        // id -> { data (full state json), sha, stateFile }

async function load() {
  const content = document.getElementById('content');
  if (!hasGhCreds()) {
    content.innerHTML = renderGhSetupForm('포지션(보유 티어, 현금, 대기 주문)을 실제 체결과 다르게 고치려면 이 저장소 쓰기 권한이 있는 개인 액세스 토큰이 필요합니다.');
    document.getElementById('updated').textContent = '';
    wireGhSetupForm(load);
    return;
  }

  content.innerHTML = '<div class="card">불러오는 중…</div>';
  try {
    const cfgRes = await fetch('./config.json', { cache: 'no-store' });
    const cfgData = cfgRes.ok ? await cfgRes.json() : { portfolios: [] };
    FEES = {};
    cfgData.portfolios.forEach(p => { FEES[p.id] = p.fee; });

    const portfoliosFile = await ghGetFile('config/portfolios.json');
    PORTFOLIOS = portfoliosFile.data;

    STATE = {};
    for (const pf of PORTFOLIOS) {
      const f = await ghGetFile(pf.state_file);
      STATE[pf.id] = { data: f.data, sha: f.sha, stateFile: pf.state_file };
    }

    document.getElementById('updated').innerHTML =
      '실시간 조회됨 · <a href="#" id="disconnect" style="color:var(--muted)">GitHub 연결 해제</a>';
    render();
    document.getElementById('disconnect').onclick = (e) => {
      e.preventDefault();
      clearGhCreds();
      load();
    };
  } catch (e) {
    content.innerHTML = `<div class="card"><div class="err">${e.message}</div></div>`;
  }
}

function render() {
  document.getElementById('content').innerHTML =
    '<div class="help" style="margin-bottom:12px">실제 체결이 자동 계산과 다르면 여기서 직접 고칠 수 있습니다. 저장하면 바로 반영되고, 다음 자동 실행부터 이 값을 기준으로 계산됩니다.</div>' +
    PORTFOLIOS.map(renderPortfolio).join('');
  PORTFOLIOS.forEach(pf => wirePortfolio(pf));
}

function renderPortfolio(pf) {
  const s = STATE[pf.id];
  const label = pf.short_label || pf.name;
  let html = `<div class="card" id="card-${pf.id}"><h2>${label}</h2>`;
  html += `<div class="sub">as_of_date: ${s.data.as_of_date || '-'}</div>`;

  html += '<div class="section-title">현금</div>';
  html += `<input class="tier-input" style="width:140px" id="cash-${pf.id}" type="number" step="0.01" value="${s.data.cash}" />`;

  html += '<div class="section-title">보유 중인 티어 (매도 대기)</div>';
  html += `<div id="positions-${pf.id}">${(s.data.open_positions || []).map((p, i) => renderPosCard(pf.id, i, p)).join('')}</div>`;
  html += `<button class="add-row" id="addpos-${pf.id}">+ 포지션 추가</button>`;

  html += '<div class="section-title">대기 중인 매수 주문</div>';
  html += renderPendingOrder(pf.id, s.data.pending_order);

  html += `<div class="save-bar"><button class="save" id="save-${pf.id}">이 계좌 저장</button></div>`;
  html += '</div>';
  return html;
}

function renderPosCard(pfId, i, p) {
  return `<div class="pos-card" data-idx="${i}">
    <div class="pos-row">
      <label>티어 <input class="pos-f" data-f="slot" type="number" step="1" value="${p.slot}" /></label>
      <label>수량 <input class="pos-f" data-f="qty" type="number" step="1" value="${p.qty}" /></label>
    </div>
    <div class="pos-row">
      <label>매수일 <input class="pos-f" data-f="buy_date" type="date" value="${p.buy_date}" /></label>
      <label>매수가 <input class="pos-f" data-f="buy_price" type="number" step="0.01" value="${p.buy_price}" /></label>
    </div>
    <div class="pos-row">
      <label>목표가(매도주문가) <input class="pos-f" data-f="target_price" type="number" step="0.01" value="${p.target_price}" /></label>
      <label>정리예정일 <input class="pos-f" data-f="cutoff_date" type="date" value="${p.cutoff_date}" /></label>
    </div>
    <button class="del-row" data-idx="${i}">이 포지션 삭제</button>
  </div>`;
}

function renderPendingOrder(pfId, po) {
  const has = !!po;
  return `<div class="pos-card" id="pending-${pfId}">
    <label class="checkline"><input type="checkbox" id="pending-none-${pfId}" ${has ? '' : 'checked'} /> 대기 중인 매수 주문 없음</label>
    <div id="pending-fields-${pfId}" ${has ? '' : 'style="display:none"'}>
      <div class="pos-row">
        <label>티어 <input class="pend-f" id="pend-slot-${pfId}" type="number" step="1" value="${po ? po.slot : 1}" /></label>
        <label>주문일 <input class="pend-f" id="pend-date-${pfId}" type="date" value="${po ? po.for_date : ''}" /></label>
      </div>
      <div class="pos-row">
        <label>지정가 <input class="pend-f" id="pend-price-${pfId}" type="number" step="0.01" value="${po ? po.order_price : ''}" /></label>
        <label>배정 시드 <input class="pend-f" id="pend-seed-${pfId}" type="number" step="0.01" value="${po ? po.seed : ''}" /></label>
      </div>
    </div>
  </div>`;
}

function wirePortfolio(pf) {
  const id = pf.id;
  document.getElementById('cash-' + id).oninput = (e) => { STATE[id].data.cash = Number(e.target.value); };

  document.getElementById('addpos-' + id).onclick = () => {
    const today = new Date().toISOString().slice(0, 10);
    STATE[id].data.open_positions.push({
      slot: (STATE[id].data.open_positions.length || 0) + 1,
      buy_date: today, buy_price: 0, qty: 0, cost: 0, buy_fee: 0,
      target_price: 0, cutoff_date: today,
    });
    render();
  };

  document.querySelectorAll(`#positions-${id} .pos-card`).forEach(card => {
    const idx = Number(card.dataset.idx);
    card.querySelectorAll('.pos-f').forEach(inp => {
      inp.oninput = () => {
        const field = inp.dataset.f;
        const val = (field === 'buy_date' || field === 'cutoff_date') ? inp.value : Number(inp.value);
        STATE[id].data.open_positions[idx][field] = val;
      };
    });
    const delBtn = card.querySelector('.del-row');
    delBtn.onclick = () => {
      STATE[id].data.open_positions.splice(idx, 1);
      render();
    };
  });

  const noneBox = document.getElementById('pending-none-' + id);
  noneBox.onchange = () => {
    document.getElementById('pending-fields-' + id).style.display = noneBox.checked ? 'none' : '';
  };

  document.getElementById('save-' + id).onclick = () => savePortfolio(pf);
}

async function savePortfolio(pf) {
  const id = pf.id;
  const btn = document.getElementById('save-' + id);
  btn.disabled = true;
  btn.textContent = '저장 중…';
  try {
    const fee = FEES[id] || 0;
    const data = STATE[id].data;

    // recompute derived fields so a later sell's profit calc stays consistent
    data.open_positions.forEach(p => {
      p.cost = Math.round(p.buy_price * p.qty * 100) / 100;
      p.buy_fee = Math.round(p.cost * fee * 100) / 100;
    });
    data.total_shares = data.open_positions.reduce((sum, p) => sum + Number(p.qty), 0);

    const noneBox = document.getElementById('pending-none-' + id);
    if (noneBox.checked) {
      data.pending_order = null;
    } else {
      data.pending_order = {
        slot: Number(document.getElementById('pend-slot-' + id).value),
        order_price: Number(document.getElementById('pend-price-' + id).value),
        seed: Number(document.getElementById('pend-seed-' + id).value),
        for_date: document.getElementById('pend-date-' + id).value,
      };
    }

    const result = await ghPutFile(STATE[id].stateFile, data, STATE[id].sha, `포지션 수동 정정: ${id} (웹 대시보드)`);
    STATE[id].sha = result.content.sha;
    toast('저장 완료 ✅ ' + (pf.short_label || pf.name));
  } catch (err) {
    toast(err.message, 6000);
  } finally {
    btn.disabled = false;
    btn.textContent = '이 계좌 저장';
  }
}

load();
</script>
</body>
</html>
