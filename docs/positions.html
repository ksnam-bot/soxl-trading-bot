<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SOXL 포지션 수정</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="SOXL 신호" />
<link rel="stylesheet" href="./style.css" />
<style>
  details.advanced { margin-top: 18px; }
  details.advanced > summary {
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    padding: 10px 0;
    list-style: none;
  }
  details.advanced > summary::-webkit-details-marker { display: none; }
  details.advanced > summary::before { content: '▸ '; }
  details.advanced[open] > summary::before { content: '▾ '; }
  .quickfix-row { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 10px; }
  .quickfix-row label { flex: 1; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  .quickfix-row input {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <header>
    <h1>포지션 수정</h1>
    <div class="updated" id="updated">불러오는 중…</div>
  </header>
  <a href="./index.html" class="primary-tab">오늘의 신호</a>
  <nav class="secondary-tabs">
    <a href="./settings.html">설정값</a>
    <a href="./positions.html" class="active">포지션 수정</a>
    <a href="./history.html">거래 이력</a>
  </nav>
  <div id="content"></div>

<script src="./gh-common.js"></script>
<script>
let PORTFOLIOS = [];   // from config/portfolios.json via GitHub API (id, name, short_label, state_file, ...)
let PCFG = {};         // id -> { fee, target[], loss_days[] }, from docs/config.json (public, no auth needed)
let STATE = {};        // id -> { data (full state json), sha, stateFile }

async function load() {
  const content = document.getElementById('content');
  if (!hasGhCreds()) {
    content.innerHTML = renderGhSetupForm('체결 수량/가격이 실제와 다를 때 고치려면 이 저장소 쓰기 권한이 있는 개인 액세스 토큰이 필요합니다.');
    document.getElementById('updated').textContent = '';
    wireGhSetupForm(load);
    return;
  }

  content.innerHTML = '<div class="card">불러오는 중…</div>';
  try {
    const cfgRes = await fetch('./config.json', { cache: 'no-store' });
    const cfgData = cfgRes.ok ? await cfgRes.json() : { portfolios: [] };
    PCFG = {};
    cfgData.portfolios.forEach(p => {
      PCFG[p.id] = { fee: p.fee, sec: p.sec, comp: p.comp, target: p.target, loss_days: p.loss_days, seed_mode: p.seed_mode };
    });

    const portfoliosFile = await ghGetFile('config/portfolios.json');
    PORTFOLIOS = portfoliosFile.data;

    STATE = {};
    for (const pf of PORTFOLIOS) {
      const f = await ghGetFile(pf.state_file);
      STATE[pf.id] = { data: f.data, sha: f.sha, stateFile: pf.state_file };
    }

    document.getElementById('updated').innerHTML =
      '실시간 조회됨 · <a href="#" id="disconnect" style="color:var(--muted)">GitHub 연결 해제</a>';
    render();
    document.getElementById('disconnect').onclick = (e) => {
      e.preventDefault();
      clearGhCreds();
      load();
    };
  } catch (e) {
    content.innerHTML = `<div class="card"><div class="err">${e.message}</div></div>`;
  }
}

function roundUp2(x) { return Math.ceil(x * 100 - 1e-9) / 100; }
function round2(x) { return Math.round(x * 100) / 100; }

function render() {
  document.getElementById('content').innerHTML =
    '<div class="help" style="margin-bottom:12px">주문을 실수로 다르게 넣었거나 체결이 다르게 됐을 때, 여기서 바로 고치면 됩니다. 저장하면 즉시 반영되고 다음 자동 실행부터 이 값 기준으로 계산됩니다.</div>' +
    PORTFOLIOS.map(renderPortfolio).join('');
  PORTFOLIOS.forEach(pf => wirePortfolio(pf));
}

function renderPortfolio(pf) {
  const s = STATE[pf.id];
  const label = pf.short_label || pf.name;
  const todayPos = (s.data.open_positions || []).find(p => p.buy_date === s.data.as_of_date);
  const idx = todayPos ? s.data.open_positions.indexOf(todayPos) : -1;

  let html = `<div class="card"><h2>${label}</h2>`;
  html += `<div class="sub">최근 처리일: ${s.data.as_of_date || '-'}</div>`;

  if (todayPos) {
    html += `<div class="section-title">오늘(${s.data.as_of_date}) 매수 체결 수정</div>`;
    html += `<div class="quickfix-row">
      <label>실제 체결가 <input id="qf-price-${pf.id}" type="number" step="0.01" value="${todayPos.buy_price}" /></label>
      <label>실제 체결 수량 <input id="qf-qty-${pf.id}" type="number" step="1" value="${todayPos.qty}" /></label>
    </div>
    <div class="save-bar"><button class="save" id="qf-save-${pf.id}">이 체결 수정 저장</button></div>`;
  } else {
    html += `<div class="section-title">오늘 매수 체결 수정</div>`;
    html += `<div class="empty">${s.data.as_of_date || '최근'} 날짜에 새로 매수 체결된 티어가 없습니다.</div>`;
  }

  const todaySells = (s.data.history || [])
    .map((h, i) => ({ h, i }))
    .filter(x => x.h.type === 'sell' && x.h.date === s.data.as_of_date);

  if (todaySells.length) {
    html += `<div class="section-title">오늘(${s.data.as_of_date}) 매도 체결 수정</div>`;
    todaySells.forEach(({ h, i }) => {
      html += `<div class="sub" style="margin-bottom:6px">${h.slot}번 티어 (매수 ${h.buy_price}, ${h.buy_date} 매수)</div>`;
      html += `<div class="quickfix-row">
        <label>실제 체결가 <input id="qfs-price-${pf.id}-${i}" type="number" step="0.01" value="${h.price}" /></label>
        <label>실제 체결 수량 <input id="qfs-qty-${pf.id}-${i}" type="number" step="1" value="${h.qty}" /></label>
      </div>
      <div class="save-bar"><button class="save" id="qfs-save-${pf.id}-${i}">이 매도 수정 저장</button></div>`;
    });
  } else {
    html += `<div class="section-title">오늘 매도 체결 수정</div>`;
    html += `<div class="empty">${s.data.as_of_date || '최근'} 날짜에 새로 매도 체결된 티어가 없습니다.</div>`;
    html += `<div class="help">매도가 자동 계산과 달리 아예 안 됐어야 하거나 다른 티어가 팔렸어야 한다면, 아래 "고급" 항목에서 포지션을 직접 추가/삭제해주세요.</div>`;
  }

  html += `<details class="advanced"><summary>고급: 포지션/현금/대기주문 직접 관리</summary>`;
  html += `<div class="section-title">현금</div>`;
  html += `<input class="tier-input" style="width:140px" id="cash-${pf.id}" type="number" step="0.01" value="${s.data.cash}" />`;

  html += '<div class="section-title">보유 중인 티어 (매도 대기)</div>';
  html += `<div id="positions-${pf.id}">${(s.data.open_positions || []).map((p, i) => renderPosCard(pf.id, i, p)).join('')}</div>`;
  html += `<button class="add-row" id="addpos-${pf.id}">+ 포지션 추가</button>`;

  html += '<div class="section-title">대기 중인 매수 주문</div>';
  html += renderPendingOrder(pf.id, s.data.pending_order);

  html += `<div class="save-bar"><button class="save" id="save-${pf.id}">이 계좌 전체 저장</button></div>`;
  html += '</details>';
  html += '</div>';
  return html;
}

function renderPosCard(pfId, i, p) {
  return `<div class="pos-card" data-idx="${i}">
    <div class="pos-row">
      <label>티어 <input class="pos-f" data-f="slot" type="number" step="1" value="${p.slot}" /></label>
      <label>수량 <input class="pos-f" data-f="qty" type="number" step="1" value="${p.qty}" /></label>
    </div>
    <div class="pos-row">
      <label>매수일 <input class="pos-f" data-f="buy_date" type="date" value="${p.buy_date}" /></label>
      <label>매수가 <input class="pos-f" data-f="buy_price" type="number" step="0.01" value="${p.buy_price}" /></label>
    </div>
    <div class="pos-row">
      <label>목표가(매도주문가) <input class="pos-f" data-f="target_price" type="number" step="0.01" value="${p.target_price}" /></label>
      <label>정리예정일 <input class="pos-f" data-f="cutoff_date" type="date" value="${p.cutoff_date}" /></label>
    </div>
    <button class="del-row" data-idx="${i}">이 포지션 삭제</button>
  </div>`;
}

function renderPendingOrder(pfId, po) {
  const has = !!po;
  return `<div class="pos-card" id="pending-${pfId}">
    <label class="checkline"><input type="checkbox" id="pending-none-${pfId}" ${has ? '' : 'checked'} /> 대기 중인 매수 주문 없음</label>
    <div id="pending-fields-${pfId}" ${has ? '' : 'style="display:none"'}>
      <div class="pos-row">
        <label>티어 <input class="pend-f" id="pend-slot-${pfId}" type="number" step="1" value="${po ? po.slot : 1}" /></label>
        <label>주문일 <input class="pend-f" id="pend-date-${pfId}" type="date" value="${po ? po.for_date : ''}" /></label>
      </div>
      <div class="pos-row">
        <label>지정가 <input class="pend-f" id="pend-price-${pfId}" type="number" step="0.01" value="${po ? po.order_price : ''}" /></label>
        <label>배정 시드 <input class="pend-f" id="pend-seed-${pfId}" type="number" step="0.01" value="${po ? po.seed : ''}" /></label>
      </div>
    </div>
  </div>`;
}

function wirePortfolio(pf) {
  const id = pf.id;
  const s = STATE[id];
  const todayPos = (s.data.open_positions || []).find(p => p.buy_date === s.data.as_of_date);

  if (todayPos) {
    document.getElementById('qf-save-' + id).onclick = () => saveQuickFix(pf, todayPos);
  }

  (s.data.history || []).forEach((h, i) => {
    if (h.type === 'sell' && h.date === s.data.as_of_date) {
      const btn = document.getElementById(`qfs-save-${id}-${i}`);
      if (btn) btn.onclick = () => saveSellFix(pf, i);
    }
  });

  document.getElementById('cash-' + id).oninput = (e) => { STATE[id].data.cash = Number(e.target.value); };

  document.getElementById('addpos-' + id).onclick = () => {
    const today = new Date().toISOString().slice(0, 10);
    STATE[id].data.open_positions.push({
      slot: (STATE[id].data.open_positions.length || 0) + 1,
      buy_date: today, buy_price: 0, qty: 0, cost: 0, buy_fee: 0,
      target_price: 0, cutoff_date: today,
    });
    render();
  };

  document.querySelectorAll(`#positions-${id} .pos-card`).forEach(card => {
    const idx = Number(card.dataset.idx);
    card.querySelectorAll('.pos-f').forEach(inp => {
      inp.oninput = () => {
        const field = inp.dataset.f;
        const val = (field === 'buy_date' || field === 'cutoff_date') ? inp.value : Number(inp.value);
        STATE[id].data.open_positions[idx][field] = val;
      };
    });
    const delBtn = card.querySelector('.del-row');
    delBtn.onclick = () => {
      STATE[id].data.open_positions.splice(idx, 1);
      render();
    };
  });

  const noneBox = document.getElementById('pending-none-' + id);
  noneBox.onchange = () => {
    document.getElementById('pending-fields-' + id).style.display = noneBox.checked ? 'none' : '';
  };

  document.getElementById('save-' + id).onclick = () => savePortfolio(pf);
}

async function saveQuickFix(pf, pos) {
  const id = pf.id;
  const btn = document.getElementById('qf-save-' + id);
  btn.disabled = true;
  btn.textContent = '저장 중…';
  try {
    const cfg = PCFG[id] || { fee: 0, target: [], loss_days: [] };
    const newPrice = Number(document.getElementById('qf-price-' + id).value);
    const newQty = Number(document.getElementById('qf-qty-' + id).value);

    const oldTotal = round2(pos.cost + pos.buy_fee);
    const newCost = round2(newPrice * newQty);
    const newFee = round2(newCost * cfg.fee);
    const newTotal = round2(newCost + newFee);

    STATE[id].data.cash = round2(STATE[id].data.cash + oldTotal - newTotal);
    pos.buy_price = newPrice;
    pos.qty = newQty;
    pos.cost = newCost;
    pos.buy_fee = newFee;
    const targetRate = (cfg.target && cfg.target[pos.slot - 1] != null) ? cfg.target[pos.slot - 1] : 0;
    pos.target_price = roundUp2(newPrice * (1 + targetRate));
    STATE[id].data.total_shares = STATE[id].data.open_positions.reduce((sum, p) => sum + Number(p.qty), 0);

    const result = await ghPutFile(STATE[id].stateFile, STATE[id].data, STATE[id].sha, `오늘 체결 정정: ${id} (웹 대시보드)`);
    STATE[id].sha = result.content.sha;
    toast('저장 완료 ✅ ' + (pf.short_label || pf.name));
    render();
  } catch (err) {
    toast(err.message, 6000);
    btn.disabled = false;
    btn.textContent = '이 체결 수정 저장';
  }
}

async function saveSellFix(pf, histIdx) {
  const id = pf.id;
  const btn = document.getElementById(`qfs-save-${id}-${histIdx}`);
  btn.disabled = true;
  btn.textContent = '저장 중…';
  try {
    const cfg = PCFG[id] || { fee: 0, sec: 0, seed_mode: 'global' };
    const h = STATE[id].data.history[histIdx];
    const newPrice = Number(document.getElementById(`qfs-price-${id}-${histIdx}`).value);
    const newQty = Number(document.getElementById(`qfs-qty-${id}-${histIdx}`).value);

    // back out the original buy-side cost basis from the already-recorded profit,
    // so we don't need the (already-closed) position's own cost/fee fields.
    const buyTotal = round2(h.proceeds - h.fee - h.profit);

    const oldNet = round2(h.proceeds - h.fee);
    const newProceeds = round2(newPrice * newQty);
    const newFee = round2(newProceeds * (cfg.fee + (cfg.sec || 0)));
    const newNet = round2(newProceeds - newFee);
    const newProfit = round2(newProceeds - newFee - buyTotal);

    STATE[id].data.cash = round2(STATE[id].data.cash + newNet - oldNet);

    if (cfg.seed_mode === 'round_lag' && h.buy_round != null) {
      const rph = STATE[id].data.round_profit_history || {};
      rph[h.buy_round] = round2((rph[h.buy_round] || 0) + (newProfit - h.profit));
      STATE[id].data.round_profit_history = rph;
    } else if (cfg.seed_mode === 'global' && STATE[id].data.compounded_principal != null) {
      STATE[id].data.compounded_principal = round2(
        STATE[id].data.compounded_principal + (newProfit - h.profit) * (cfg.comp != null ? cfg.comp : 1)
      );
    }

    h.price = newPrice;
    h.qty = newQty;
    h.proceeds = newProceeds;
    h.fee = newFee;
    h.profit = newProfit;
    h.profit_pct = h.buy_price ? Math.round((newPrice / h.buy_price - 1) * 1e6) / 1e6 : 0;

    const result = await ghPutFile(STATE[id].stateFile, STATE[id].data, STATE[id].sha, `오늘 매도 정정: ${id} (웹 대시보드)`);
    STATE[id].sha = result.content.sha;
    toast('저장 완료 ✅ ' + (pf.short_label || pf.name));
    render();
  } catch (err) {
    toast(err.message, 6000);
    btn.disabled = false;
    btn.textContent = '이 매도 수정 저장';
  }
}

async function savePortfolio(pf) {
  const id = pf.id;
  const btn = document.getElementById('save-' + id);
  btn.disabled = true;
  btn.textContent = '저장 중…';
  try {
    const fee = (PCFG[id] && PCFG[id].fee) || 0;
    const data = STATE[id].data;

    // recompute derived fields so a later sell's profit calc stays consistent
    data.open_positions.forEach(p => {
      p.cost = Math.round(p.buy_price * p.qty * 100) / 100;
      p.buy_fee = Math.round(p.cost * fee * 100) / 100;
    });
    data.total_shares = data.open_positions.reduce((sum, p) => sum + Number(p.qty), 0);

    const noneBox = document.getElementById('pending-none-' + id);
    if (noneBox.checked) {
      data.pending_order = null;
    } else {
      data.pending_order = {
        slot: Number(document.getElementById('pend-slot-' + id).value),
        order_price: Number(document.getElementById('pend-price-' + id).value),
        seed: Number(document.getElementById('pend-seed-' + id).value),
        for_date: document.getElementById('pend-date-' + id).value,
      };
    }

    const result = await ghPutFile(STATE[id].stateFile, data, STATE[id].sha, `포지션 수동 정정: ${id} (웹 대시보드)`);
    STATE[id].sha = result.content.sha;
    toast('저장 완료 ✅ ' + (pf.short_label || pf.name));
  } catch (err) {
    toast(err.message, 6000);
  } finally {
    btn.disabled = false;
    btn.textContent = '이 계좌 전체 저장';
  }
}

load();
</script>
</body>
</html>
