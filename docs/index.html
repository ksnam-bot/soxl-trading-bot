<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>오늘의 트레이딩 (SOXL)</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="SOXL 신호" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23111827'/%3E%3Ctext x='50' y='62' font-size='42' text-anchor='middle' fill='%2334d399' font-family='-apple-system,sans-serif' font-weight='700'%3ES%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <h1>오늘의 트레이딩 (SOXL)</h1>
    <div class="updated" id="updated">불러오는 중…</div>
  </header>
  <nav class="secondary-tabs">
    <a href="./settings.html">설정값</a>
    <a href="./positions.html">포지션 수정</a>
    <a href="./history.html">거래 이력</a>
  </nav>
  <div id="content"></div>

<script>
async function load() {
  const content = document.getElementById('content');
  try {
    const res = await fetch('./latest.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('latest.json 없음');
    const data = await res.json();
    document.getElementById('updated').textContent =
      '갱신: ' + new Date(data.generated_at).toLocaleString('ko-KR');
    content.innerHTML = renderCombined(data.combined, data.fx_usdkrw) +
      data.portfolios.map(renderPortfolio).join('');
  } catch (e) {
    content.innerHTML = '<div class="card"><div class="err">아직 데이터가 없습니다. GitHub Actions가 처음 실행되면 여기 표시됩니다.</div></div>';
    document.getElementById('updated').textContent = '';
  }
}

function fmt(n) { return '$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 }); }
function fmt2(n) { return '$' + Number(n).toFixed(2); }
function fmtKrw(n) { return '₩' + Math.round(Number(n)).toLocaleString('ko-KR'); }
function pct(x) {
  const v = Number(x) * 100;
  const sign = v >= 0 ? '+' : '';
  return sign + v.toFixed(2) + '%';
}
function retClass(x) { return Number(x) >= 0 ? 'ret pos' : 'ret neg'; }

function renderCombined(c, fx) {
  if (!c) return '';
  let html = `<div class="stat-hero">
    <div class="label">합산 총자산</div>
    <div class="value">${fmt(c.total_value)}</div>
    <div class="${retClass(c.return_pct)}">${pct(c.return_pct)}</div>`;
  if (fx && fx.rate) {
    html += `<div class="krw-note">≈ ${fmtKrw(c.total_value * fx.rate)} · 환율 ${fx.rate.toLocaleString('ko-KR', {maximumFractionDigits:1})}원 (${fx.date})</div>`;
  }
  html += `</div>`;
  html += `<div class="stat-grid">
    <div class="stat-card">
      <div class="label">보유 주식</div>
      <div class="value">${c.shares.toLocaleString('en-US')}주</div>
    </div>
    <div class="stat-card">
      <div class="label">현금</div>
      <div class="value">${fmt(c.cash)}</div>
    </div>
  </div>`;
  return html;
}

function renderPortfolio(p) {
  const label = p.short_label || p.name;
  let html = `<div class="stat-grid">
    <div class="stat-card">
      <div class="label">${label} 총자산</div>
      <div class="value">${fmt(p.total_value)}</div>
      <div class="${retClass(p.return_pct)}">${pct(p.return_pct)}</div>
    </div>
    <div class="stat-card">
      <div class="label">${label} 보유 ${p.shares}주</div>
      <div class="value" style="font-size:14px">현금 ${fmt(p.cash)}</div>
      <div class="value" style="font-size:14px">평가 ${fmt(p.holding_value)}</div>
    </div>
  </div>`;

  html += `<div class="card"><h2>${label}</h2>`;
  html += `<div class="sub">${p.trading_date} 종가 ${fmt2(p.close)}</div>`;

  html += '<div class="section-title">어제 체결</div>';
  let any = false;
  if (p.filled_buy) {
    any = true;
    html += `<div class="fill-line buy"><div class="headline">✅ 매수 완료 ${fmt2(p.filled_buy.buy_price)} × ${p.filled_buy.qty}주</div><div class="detail">${p.filled_buy.slot}번 티어</div></div>`;
  }
  if (p.unfilled_buy_price != null) {
    any = true;
    html += `<div class="fill-line"><div class="headline">⏭ 매수 미체결</div><div class="detail">지정가 ${fmt2(p.unfilled_buy_price)} 위에서 마감</div></div>`;
  }
  for (const s of p.sells) {
    any = true;
    const label2 = s.reason === 'target' ? '🎯 목표가 도달 매도 완료' : '⏰ 보유기한 만료 정리매도 완료';
    const profitTxt = `매수 ${fmt2(s.buy_price)} → 매도 ${fmt2(s.sell_price)} · 수익 ${s.profit >= 0 ? '+' : ''}${fmt2(s.profit)} (${pct(s.profit_pct)})`;
    html += `<div class="fill-line sell"><div class="headline">${label2} ${s.qty}주</div><div class="detail">${profitTxt}</div></div>`;
  }
  if (!any) html += '<div class="empty">새 체결 없음</div>';

  html += '<div class="section-title">오늘 매수 주문</div>';
  if (p.no_open_slot_today) {
    html += '<div class="empty">신규 매수 없음 (전 티어 보유 중)</div>';
  } else if (p.pending_order && p.pending_order.ladder.length) {
    for (const l of p.pending_order.ladder) {
      html += `<div class="order-line buy"><span>${fmt2(l.price)} × ${l.qty}주</span><span class="slot-badge">${p.pending_order.slot}번</span></div>`;
    }
  } else {
    html += '<div class="empty">신규 매수 주문 없음</div>';
  }

  html += '<div class="section-title">오늘 매도 주문</div>';
  if (p.open_positions.length) {
    for (const o of p.open_positions) {
      html += `<div class="order-line sell"><span>${fmt2(o.target_price)} × ${o.qty}주</span><span class="slot-badge">${o.slot}번</span></div>`;
    }
  } else {
    html += '<div class="empty">매도 주문 없음 (보유 티어 없음)</div>';
  }

  html += '</div>';
  return html;
}

load();
</script>
</body>
</html>
